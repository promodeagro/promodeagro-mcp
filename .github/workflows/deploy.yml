name: Deploy E-commerce MCP Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'src/**'
      - 'mcp_http_server.py'
      - 'Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'Dockerfile'

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          role-session-name: github-actions-validate
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation templates
        run: |
          cd deploy
          echo "🔍 Validating CloudFormation templates..."
          
          for template in cloudformation-*.yaml; do
            echo "Validating: $template"
            aws cloudformation validate-template --template-body file://$template || exit 1
          done
          
          echo "✅ All templates validated successfully!"

      - name: Add PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const icon = success ? '✅' : '❌';
            const status = success ? 'passed' : 'failed';
            
            const comment = `
            ## ${icon} CloudFormation Template Validation ${status}
            
            **Template validation:** ${success ? '✅ Passed' : '❌ Failed'}
            
            ${success ? 
              '🚀 CloudFormation templates are valid and ready for deployment!' : 
              '🔧 Please fix template errors before merging.'
            }
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          role-session-name: github-actions-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        run: |
          echo "AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t ecommerce-mcp-server-dev:${{ github.sha }} \
            -t ecommerce-mcp-server-dev:latest .
          
          docker tag ecommerce-mcp-server-dev:${{ github.sha }} \
            ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ecommerce-mcp-server-dev:${{ github.sha }}
          docker tag ecommerce-mcp-server-dev:latest \
            ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ecommerce-mcp-server-dev:latest
          
          docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ecommerce-mcp-server-dev:${{ github.sha }}
          docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ecommerce-mcp-server-dev:latest

      - name: Deploy infrastructure
        run: |
          cd deploy
          chmod +x deploy.sh
          ./deploy.sh dev infrastructure-only

      - name: Verify deployment
        run: |
          cd deploy
          chmod +x verify-deployment.sh
          ./verify-deployment.sh dev || echo "⚠️ Some checks failed, review logs"
