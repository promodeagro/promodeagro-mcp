name: Deploy E-commerce MCP to Development

on:
  push:
    branches: [ dev ]
  workflow_dispatch: # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ECR_REPOSITORY: ecommerce-mcp-server-dev

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
        role-session-name: GitHubActions-DeployDev
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity
        echo "AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
        
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        
    - name: Build Docker image
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          -t ${{ env.ECR_REPOSITORY }}:latest .
        
    - name: Tag Docker images for ECR
      run: |
        docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker tag ${{ env.ECR_REPOSITORY }}:latest \
          ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        
    - name: Push Docker images to ECR
      run: |
        docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        
    - name: Deploy infrastructure with CloudFormation
      run: |
        cd deploy
        chmod +x deploy.sh
        ./deploy.sh dev infrastructure-only
        
    - name: Get deployment outputs
      id: outputs
      run: |
        BACKEND_URL=$(aws cloudformation describe-stacks \
          --stack-name ecommerce-mcp-main-dev \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='BackendUrl'].OutputValue" \
          --output text 2>/dev/null || echo "Not available")
        
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name ecommerce-mcp-main-dev \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
          --output text 2>/dev/null || echo "Not available")
        
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        
    - name: Run health checks
      run: |
        echo "🏥 Running development health checks..."
        
        if [ "${{ steps.outputs.outputs.api_url }}" != "Not available" ]; then
          echo "Checking MCP server health..."
          sleep 30  # Wait for deployment to stabilize
          curl -f "${{ steps.outputs.outputs.api_url }}/health" || echo "⚠️ Health check failed (may need more time)"
        fi
        
    - name: Run deployment verification
      run: |
        cd deploy
        chmod +x verify-deployment.sh
        ./verify-deployment.sh dev || echo "⚠️ Some checks failed, but deployment may still be successful"
        
    - name: Create deployment summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🚀 E-commerce MCP Development Deployment Complete
        
        **Environment:** Development
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        **Deployed by:** ${{ github.actor }}
        **Deployment Time:** $(date -u)
        
        ## 📋 Deployment Details
        - **AWS Account:** ${{ env.AWS_ACCOUNT }}
        - **AWS Region:** ${{ env.AWS_REGION }}
        - **Docker Image:** ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        - **ECS Resources:** 256 CPU / 512 MB Memory (minimal)
        
        ## 🔗 Application URLs
        - **API Domain:** ${{ steps.outputs.outputs.api_url }}
        - **Health Check:** ${{ steps.outputs.outputs.api_url }}/health
        - **MCP Tools:** ${{ steps.outputs.outputs.api_url }}/tools
        - **Load Balancer:** ${{ steps.outputs.outputs.backend_url }}
        
        ## 📦 Deployed Stacks
        - ✅ ecommerce-mcp-main-dev (Main orchestrator)
        - ✅ GlobalStack (SSL certificates)
        - ✅ NetworkStack (VPC, ECS cluster)
        - ✅ StorageStack (S3 bucket)
        - ✅ BackendStack (ECS service, ALB)
        - ✅ DomainStack (Route53 DNS)
        
        ## 🛠️ Development Notes
        - Minimal ECS resources for cost optimization
        - 0 NAT gateways (public subnets only)
        - Debug logging enabled
        - Single task deployment
        EOF
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Development deployment failed!"
        echo "Check the logs above for error details."
        echo "Common dev deployment issues:"
        echo "- AWS permissions (check your dev role)"
        echo "- Docker build failures"
        echo "- CloudFormation stack conflicts"
        echo "- ECR repository access"
