name: Build and Test Docker Image

on:
  push:
    branches: [ main, dev, stage ]
    paths:
      - 'src/**'
      - 'mcp_http_server.py'
      - 'mcp_stdio_server.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    branches: [ main, dev, stage ]
    paths:
      - 'src/**'
      - 'mcp_http_server.py'
      - 'mcp_stdio_server.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

env:
  IMAGE_NAME: ecommerce-mcp-server

jobs:
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: ${{ env.IMAGE_NAME }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Test Docker image - Basic smoke test
      run: |
        echo "🧪 Running basic smoke tests..."
        
        # Start container in background
        docker run -d --name mcp-test \
          -p 8000:8000 \
          -e LOG_LEVEL=DEBUG \
          ${{ env.IMAGE_NAME }}:test
        
        # Wait for container to start
        echo "⏳ Waiting for container to start..."
        sleep 15
        
        # Check if container is running
        if ! docker ps | grep mcp-test; then
          echo "❌ Container failed to start"
          docker logs mcp-test
          exit 1
        fi
        
        echo "✅ Container is running"
        
        # Check health endpoint
        echo "🏥 Checking health endpoint..."
        if curl -f http://localhost:8000/health; then
          echo "✅ Health endpoint responding"
        else
          echo "❌ Health endpoint failed"
          docker logs mcp-test
          exit 1
        fi
        
        # Check tools endpoint
        echo "🛠️ Checking tools endpoint..."
        if curl -f http://localhost:8000/tools; then
          echo "✅ Tools endpoint responding"
        else
          echo "⚠️ Tools endpoint failed (may be expected)"
        fi
        
        # Show container logs
        echo "📋 Container logs:"
        docker logs mcp-test
        
        # Clean up
        docker stop mcp-test
        docker rm mcp-test
        
        echo "✅ All smoke tests passed!"

    - name: Test Docker image - Resource limits
      run: |
        echo "🧪 Testing with minimal resource limits (matching dev config)..."
        
        # Test with minimal resources (256 CPU = 0.25 vCPU)
        docker run -d --name mcp-resource-test \
          -p 8001:8000 \
          --cpus="0.25" \
          --memory="512m" \
          -e LOG_LEVEL=INFO \
          ${{ env.IMAGE_NAME }}:test
        
        sleep 10
        
        if docker ps | grep mcp-resource-test; then
          echo "✅ Container runs with minimal resources"
          docker logs mcp-resource-test
        else
          echo "❌ Container failed with minimal resources"
          docker logs mcp-resource-test
          exit 1
        fi
        
        docker stop mcp-resource-test
        docker rm mcp-resource-test

    - name: Extract image metadata
      run: |
        docker images ${{ env.IMAGE_NAME }}:test
        
        SIZE=$(docker images ${{ env.IMAGE_NAME }}:test --format "{{.Size}}")
        echo "📦 Image size: $SIZE"
        
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🐳 Docker Build Summary
        
        **Image:** ${{ env.IMAGE_NAME }}:test
        **Size:** $SIZE
        **Platform:** linux/amd64
        
        ## ✅ Tests Passed
        - Basic smoke test
        - Health endpoint check
        - Tools endpoint check
        - Resource limits test (256 CPU / 512 MB)
        
        ## 📊 Build Details
        - Commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        - Built by: ${{ github.actor }}
        EOF

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Docker build or tests failed!"
        echo "Check the logs above for details."
