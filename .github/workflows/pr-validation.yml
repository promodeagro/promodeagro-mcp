name: E-commerce MCP PR Validation

on:
  pull_request:
    branches: [ main, stage, dev ]
    paths:
      - 'deploy/**'
      - 'src/**'
      - 'mcp_http_server.py'
      - 'mcp_stdio_server.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/**'

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials (for template validation)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
        role-session-name: GitHubActions-PRValidation
        aws-region: ${{ env.AWS_REGION }}
      continue-on-error: true
        
    - name: Validate CloudFormation templates
      id: cfn_validation
      run: |
        cd deploy
        echo "🔍 Validating CloudFormation templates..."
        
        SUCCESS=true
        for template in cloudformation-*.yaml; do
          echo "Validating: $template"
          if aws cloudformation validate-template --template-body file://$template 2>&1; then
            echo "✅ $template is valid"
          else
            echo "❌ $template validation failed"
            SUCCESS=false
          fi
        done
        
        if [ "$SUCCESS" = true ]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ All CloudFormation templates are valid!"
        else
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ Some templates failed validation"
          exit 1
        fi
        
    - name: Validate bash scripts
      id: script_validation
      run: |
        cd deploy
        echo "🔍 Checking bash scripts..."
        
        # Check if scripts are executable and have valid syntax
        for script in *.sh; do
          if [ -f "$script" ]; then
            echo "Checking: $script"
            bash -n "$script" || exit 1
          fi
        done
        
        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ All bash scripts are valid!"
        
    - name: Check Python syntax
      id: python_validation
      run: |
        echo "🔍 Checking Python syntax..."
        
        # Install Python
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        
        # Check Python files for syntax errors
        find . -name "*.py" -type f | while read file; do
          echo "Checking: $file"
          python3 -m py_compile "$file" || exit 1
        done
        
        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ All Python files have valid syntax!"
        
    - name: Validate Dockerfile
      id: docker_validation
      run: |
        echo "🔍 Checking Dockerfile..."
        
        if [ -f "Dockerfile" ]; then
          # Basic Dockerfile linting
          if grep -q "FROM" Dockerfile; then
            echo "✅ Dockerfile has valid base image"
          else
            echo "❌ Dockerfile missing FROM statement"
            exit 1
          fi
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Dockerfile is valid!"
        else
          echo "⚠️  No Dockerfile found"
          echo "status=skipped" >> $GITHUB_OUTPUT
        fi
        
    - name: Add PR comment with validation results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const cfnStatus = '${{ steps.cfn_validation.outputs.status }}';
          const scriptStatus = '${{ steps.script_validation.outputs.status }}';
          const pythonStatus = '${{ steps.python_validation.outputs.status }}';
          const dockerStatus = '${{ steps.docker_validation.outputs.status }}';
          
          const success = cfnStatus === 'success' && scriptStatus === 'success' && pythonStatus === 'success';
          const icon = success ? '✅' : '❌';
          const status = success ? 'passed' : 'failed';
          
          const comment = `
          ## ${icon} E-commerce MCP Validation ${status}
          
          ### Validation Results
          - **CloudFormation Templates:** ${cfnStatus === 'success' ? '✅ Valid' : '❌ Failed'}
          - **Bash Scripts:** ${scriptStatus === 'success' ? '✅ Valid' : '❌ Failed'}
          - **Python Syntax:** ${pythonStatus === 'success' ? '✅ Valid' : '❌ Failed'}
          - **Dockerfile:** ${dockerStatus === 'success' ? '✅ Valid' : dockerStatus === 'skipped' ? '⏭️  Skipped' : '❌ Failed'}
          
          ### Target Branch: \`${{ github.base_ref }}\`
          
          ${success ? 
            '🚀 This PR passes all validation checks and is ready for deployment!' : 
            '🔧 Please fix the validation errors above before merging.'
          }
          
          ---
          <details>
          <summary>📋 Deployment Details</summary>
          
          After this PR is merged to:
          - **\`dev\` branch** → Automatic deployment to development environment
          - **\`stage\` branch** → Automatic deployment to staging environment
          - **\`main\` branch** → Automatic deployment to production (with confirmation)
          
          The deployment uses pure CloudFormation templates with bash orchestration.
          
          </details>
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
