name: Deploy E-commerce MCP to Staging

on:
  push:
    branches: [ stage ]
  workflow_dispatch: # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: stage
  ECR_REPOSITORY: ecommerce-mcp-server-stage

jobs:
  deploy-stage:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGE }}
        role-session-name: GitHubActions-DeployStage
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity
        echo "AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
        
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        
    - name: Build Docker image
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          -t ${{ env.ECR_REPOSITORY }}:latest .
        
    - name: Tag Docker images for ECR
      run: |
        docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker tag ${{ env.ECR_REPOSITORY }}:latest \
          ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        
    - name: Push Docker images to ECR
      run: |
        docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        
    - name: Deploy infrastructure with CloudFormation
      run: |
        cd deploy
        chmod +x deploy.sh
        ./deploy.sh stage infrastructure-only
        
    - name: Get deployment outputs
      id: outputs
      run: |
        BACKEND_URL=$(aws cloudformation describe-stacks \
          --stack-name ecommerce-mcp-main-stage \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='BackendUrl'].OutputValue" \
          --output text 2>/dev/null || echo "Not available")
        
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name ecommerce-mcp-main-stage \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
          --output text 2>/dev/null || echo "Not available")
        
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        
    - name: Run health checks
      run: |
        echo "🏥 Running staging health checks..."
        
        if [ "${{ steps.outputs.outputs.api_url }}" != "Not available" ]; then
          echo "Checking MCP server health..."
          sleep 30  # Wait for deployment to stabilize
          curl -f "${{ steps.outputs.outputs.api_url }}/health" || (echo "❌ Health check failed!" && exit 1)
        fi
        
    - name: Run deployment verification
      run: |
        cd deploy
        chmod +x verify-deployment.sh
        ./verify-deployment.sh stage
        
    - name: Create deployment summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🚀 E-commerce MCP Staging Deployment Complete
        
        **Environment:** Staging
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        **Deployed by:** ${{ github.actor }}
        **Deployment Time:** $(date -u)
        
        ## 📋 Deployment Details
        - **AWS Account:** ${{ env.AWS_ACCOUNT }}
        - **AWS Region:** ${{ env.AWS_REGION }}
        - **Docker Image:** ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        
        ## 🔗 Application URLs
        - **API Domain:** ${{ steps.outputs.outputs.api_url }}
        - **Health Check:** ${{ steps.outputs.outputs.api_url }}/health
        - **MCP Tools:** ${{ steps.outputs.outputs.api_url }}/tools
        - **Load Balancer:** ${{ steps.outputs.outputs.backend_url }}
        
        ## 📦 Deployed Stacks
        - ✅ ecommerce-mcp-main-stage (Main orchestrator)
        - ✅ GlobalStack (SSL certificates)
        - ✅ NetworkStack (VPC, ECS cluster)
        - ✅ StorageStack (S3 bucket)
        - ✅ BackendStack (ECS service, ALB)
        - ✅ DomainStack (Route53 DNS)
        EOF
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Staging deployment failed!"
        echo "Check the logs above for error details."
