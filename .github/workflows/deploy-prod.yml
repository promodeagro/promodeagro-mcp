name: Deploy E-commerce MCP to Production

on:
  push:
    branches: [ main, production ]
  workflow_dispatch: # Allow manual trigger
    inputs:
      confirm_deployment:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        default: ''

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: prod
  ECR_REPOSITORY: ecommerce-mcp-server-prod

jobs:
  # Safety check for manual deployments
  validate-input:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Validate confirmation
      run: |
        if [ "${{ github.event.inputs.confirm_deployment }}" != "DEPLOY" ]; then
          echo "❌ Deployment cancelled. You must type 'DEPLOY' to confirm."
          exit 1
        fi
        echo "✅ Production deployment confirmed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate-input]
    if: always() && (needs.validate-input.result == 'success' || github.event_name == 'push')
    
    # Use production environment for additional protection
    environment: 
      name: production
      url: https://api.promodeagro.com
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
        role-session-name: GitHubActions-DeployProduction
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity
        echo "AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
        
    - name: Pre-deployment safety check
      run: |
        echo "⚠️  PRODUCTION DEPLOYMENT STARTING"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Actor: ${{ github.actor }}"
        echo "Account: ${{ env.AWS_ACCOUNT }}"
        sleep 10  # Brief pause for visibility
        
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        
    - name: Build Docker image
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          -t ${{ env.ECR_REPOSITORY }}:latest .
        
    - name: Tag Docker images for ECR
      run: |
        docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker tag ${{ env.ECR_REPOSITORY }}:latest \
          ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        
    - name: Push Docker images to ECR
      run: |
        docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker push ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        
    - name: Deploy infrastructure with CloudFormation
      run: |
        cd deploy
        chmod +x deploy.sh
        ./deploy.sh prod infrastructure-only
        
    - name: Get deployment outputs
      id: outputs
      run: |
        BACKEND_URL=$(aws cloudformation describe-stacks \
          --stack-name ecommerce-mcp-main-prod \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='BackendUrl'].OutputValue" \
          --output text 2>/dev/null || echo "Not available")
        
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name ecommerce-mcp-main-prod \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
          --output text 2>/dev/null || echo "Not available")
        
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        
    - name: Run post-deployment health checks
      run: |
        echo "🏥 Running production health checks..."
        
        if [ "${{ steps.outputs.outputs.api_url }}" != "Not available" ]; then
          echo "Checking MCP server health..."
          sleep 60  # Wait for deployment to fully stabilize
          
          # Retry health check up to 5 times
          for i in {1..5}; do
            if curl -f "${{ steps.outputs.outputs.api_url }}/health"; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "⚠️ Health check attempt $i failed, retrying..."
            sleep 10
          done
          
          echo "❌ Health checks failed after 5 attempts!"
          exit 1
        fi
        
    - name: Run deployment verification
      run: |
        cd deploy
        chmod +x verify-deployment.sh
        ./verify-deployment.sh prod
        
    - name: Create production deployment summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🚀 E-commerce MCP PRODUCTION Deployment Complete
        
        **Environment:** Production
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        **Deployed by:** ${{ github.actor }}
        **Deployment Time:** $(date -u)
        
        ## ⚠️ CRITICAL INFORMATION
        - **AWS Account:** ${{ env.AWS_ACCOUNT }}
        - **AWS Region:** ${{ env.AWS_REGION }}
        - **Docker Image:** ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        - This is a PRODUCTION deployment affecting live users
        
        ## 🔗 Production URLs
        - **API Domain:** ${{ steps.outputs.outputs.api_url }}
        - **Health Check:** ${{ steps.outputs.outputs.api_url }}/health
        - **MCP Tools:** ${{ steps.outputs.outputs.api_url }}/tools
        - **Load Balancer:** ${{ steps.outputs.outputs.backend_url }}
        
        ## 📦 Deployed Stacks
        - ✅ ecommerce-mcp-main-prod (Main orchestrator)
        - ✅ GlobalStack (SSL certificates)
        - ✅ NetworkStack (VPC, ECS cluster)
        - ✅ StorageStack (S3 bucket)
        - ✅ BackendStack (ECS service, ALB with auto-scaling)
        - ✅ DomainStack (Route53 DNS)
        
        ## 🏥 Health Checks
        ✅ All health checks passed
        
        ## 📊 Next Steps
        - Monitor CloudWatch logs for any errors
        - Check ECS service metrics
        - Verify MCP tools are responding correctly
        - Monitor for the next 30 minutes
        EOF
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "🚨 E-COMMERCE MCP PRODUCTION DEPLOYMENT FAILED!"
        echo "This requires immediate attention."
        echo "Check logs and consider rollback if necessary."
